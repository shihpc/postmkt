name: diag backtest stage1

# 持股診斷燈號回測 Stage 1（規格 docs/diag-backtest-spec.md §3.4，r5 定稿；使用者 2026-10-23／2026-10-25 裁定）：
# 只抓還原價並判定價格口徑，**不算任何報酬**。依決策樹
#   TaiwanStockPriceAdj（覆蓋率 ≥99.0% 即採用）→ TaiwanStockDividendResult 自行還原 → 皆未達才退未還原 close，
# 把決定寫進 backtest/diag_rules_price_source.json 並 commit 留痕；還原價原始資料（兩個來源都存、
# 另含全市場等權基準與興櫃代號，2026-10-25 使用者裁定）gzip 後寫 backtest/data/ 一併 commit，
# 決定檔記各檔 sha256 供 Stage 2 核對；同一批檔案另上傳 artifact 備查。
# **只在 main 上 dispatch**（Run workflow 時分支選 main；其他分支第一步就失敗）。
# 只能手動觸發、刻意不加 cron（§7.3 不進任何排程）。token 只經環境變數傳入 backtest/run_diag_rules.py（以 Authorization header 送出），
# 該腳本所有 log／例外訊息都先過 mask_secret()；GitHub 對 secrets 的 log 遮罩是第二道。
on:
  workflow_dispatch:
    inputs:
      calendar_end:
        description: 價格日曆截止日（YYYY-MM-DD；預設 2026-10-22＝規格 §3.6 事前數字的口徑）
        required: false
        default: "2026-10-22"
      allow_overwrite:
        description: 決定檔已存在時仍重做（規格：決定不得在看過任何報酬後變更，非必要勿勾）
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write   # notify-failure 開 issue 用

concurrency:
  group: diag-backtest-stage1
  cancel-in-progress: false

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 只允許 main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::本 workflow 只在 main 上 dispatch（目前 $GITHUB_REF）"; exit 1
          fi

      # diag.json 的 git 歷史就是回放來源（附錄 A 版本），需完整歷史；blob 依需求才抓
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # v2 classify.json 歷史版本（§2.6 第 2 點）＋休市行事曆
      - uses: actions/checkout@v7
        with:
          repository: shihpc/taiwan-flow-live-v2
          path: _ext/v2
          fetch-depth: 0
          filter: blob:none

      # taiwan-flows meta.calendar 與 data/daily（只看未還原 close 是否存在，不讀報酬）
      - uses: actions/checkout@v7
        with:
          repository: shihpc/taiwan-flows
          path: _ext/flows
          fetch-depth: 1
          filter: blob:none

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Stage 1（還原價與覆蓋率判定）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          CALENDAR_END: ${{ inputs.calendar_end }}
          ALLOW_OVERWRITE: ${{ inputs.allow_overwrite }}
        run: |
          extra=""
          if [ "$ALLOW_OVERWRITE" = "true" ]; then extra="--allow-overwrite"; fi
          python backtest/run_diag_rules.py stage1 \
            --repo . --ref HEAD \
            --v2-repo _ext/v2 --v2-ref HEAD \
            --flows-repo _ext/flows --flows-ref HEAD \
            --calendar-end "$CALENDAR_END" $extra
          cat backtest/diag_rules_price_source.json

      - name: Upload price data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-backtest-stage1-prices
          # 兩個來源不論採用與否都保存（決定檔 price_data.files 記各檔 sha256 與 adopted）
          path: |
            backtest/data/*.json.gz
            backtest/cache/stage1/*.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit decision
        uses: ./.github/actions/commit-data
        with:
          paths: backtest/diag_rules_price_source.json backtest/data
          message: "data: diag backtest stage1 price source"
          # backtest/data 在兩來源皆取不到時可能不存在；add_all 逐路徑容錯
          add_all: "true"

      - name: Notify failure
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          pipeline: postmkt-diag-backtest-stage1
