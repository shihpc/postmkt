name: build mktbal data

on:
  schedule:
    # 平日 22:20 台北（14:20 UTC）：排在 build.yml 21:53、diag.yml 22:10 之後，
    # 融資融券/借券/不限用途借貸官方資料約 21:00 後陸續更新完成，留緩衝
    - cron: "55 14 * * 1-5"   # 22:55 台北（備援；主觸發＝v2 Worker 晚場協調班鏈式 dispatch：diag.json 今日已備即發，2026-07-22）
  workflow_dispatch:   # 手動觸發；backfill=true 時執行一次性回補（近3年月底值＋近30交易日）
    inputs:
      backfill:
        description: "一次性回補（--backfill）"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]   # 只限 main：feature 分支觸發會在 push 階段失敗且無意義（沿用 diag.yml 教訓）
    paths:
      - src/build_mktbal.py
      - .github/workflows/mktbal.yml

permissions:
  contents: write
  issues: write   # 失敗通知開 issue 用

concurrency:
  group: build-mktbal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # backfill 帶 4 秒/請求節流，64 回補日約 35-40 分；日常 run 遠低於此
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build market_balance_history.json
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python src/build_mktbal.py --backfill
          else
            python src/build_mktbal.py
          fi

      # 市場總覽交集表第二班（見 diag.yml 同名步驟與 docs/market-overview.md）：mktbal 是晚場鏈最後一棒，
      # 這班補上 diag 那班之後才落地的上游（例：主動 ETF、輪動雷達日頻序列）。內容沒變就不重寫檔、不產生 commit。
      # 失敗不擋 mktbal 主產物，commit 之後再轉紅。backfill 手動班不跑。
      - name: Build overview
        id: overview
        if: inputs.backfill != true
        continue-on-error: true
        run: python src/build_overview.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/market_balance_history.json data/overview
          message: "data: mktbal"
          add_all: "true"

      - name: Fail if overview failed
        if: always() && steps.overview.outcome == 'failure'
        run: |
          echo "::error::build_overview 失敗（data/overview 未更新；mktbal 已照常 commit），詳見「Build overview」步驟 log"
          exit 1

      - name: Notify failure
        # cancelled 也要告警：跑一半被取消（GitHub 端異常或誤按）同樣代表該場沒產出，
        # 而 failure() 在 cancelled 時不成立（2026-07-24 pm 場靜默消失的教訓）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          pipeline: mktbal
